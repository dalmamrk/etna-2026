<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartphone Preview - Etna Trekking 2026</title>
    <style>
        body {
            margin: 0;
            padding: 30px 20px;
            background: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            color: #f1f5f9;
        }
        .preview-header {
            margin-bottom: 24px;
            text-align: center;
        }
        .preview-header h1 {
            font-size: 24px;
            margin: 0 0 6px 0;
            color: #38bdf8;
        }
        .preview-header p {
            margin: 0;
            font-size: 14px;
            color: #94a3b8;
        }
        .phone-mockup {
            width: 390px;
            height: 844px;
            border: 12px solid #1e293b;
            border-radius: 48px;
            overflow: hidden;
            box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
            background: #ffffff;
            position: relative;
        }
        .phone-notch {
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 125px;
            height: 26px;
            background: #1e293b;
            border-bottom-left-radius: 16px;
            border-bottom-right-radius: 16px;
            z-index: 1000;
            pointer-events: none;
        }
        iframe {
            width: 390px;
            height: 844px;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="preview-header">
        <h1>Simulatore Smartphone: iPhone 14/15 (390 x 844)</h1>
        <p>Verifica visiva responsiva e leggibilità a 390px di larghezza</p>
    </div>
    <div class="phone-mockup">
        <div class="phone-notch"></div>
        <iframe src="etna26.html" id="mobile-iframe"></iframe>
    </div>
</body>
</html>
